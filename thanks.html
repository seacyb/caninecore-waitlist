<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>You’re on the list | CanineCore</title>
    <meta
      name="description"
      content="Thanks for joining the CanineCore early-access list."
    />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#07101f" />
    <link rel="icon" type="image/png" href="/assets/caninecore-logo.png" />
    <link rel="apple-touch-icon" href="/assets/caninecore-logo.png" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-KKL3D0T909"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-KKL3D0T909");
    </script>

    <style>
      :root {
        color-scheme: dark;
        --background: #07101f;
        --surface: #0d1a2d;
        --surface-border: #1e3350;
        --text: #f8fafc;
        --muted: #a8b5c7;
        --primary: #38bdf8;
        --success: #34d399;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgba(56, 189, 248, 0.12),
            transparent 38%
          ),
          var(--background);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .card {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid var(--surface-border);
        border-radius: 24px;
        background: rgba(13, 26, 45, 0.94);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
        color: var(--text);
        font-size: 1.1rem;
        font-weight: 800;
        text-decoration: none;
      }

      .brand-mark {
        display: inline-flex;
        width: 42px;
        height: 42px;
        overflow: hidden;
        border-radius: 12px;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .confirmation-icon {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        place-items: center;
        border: 1px solid rgba(52, 211, 153, 0.4);
        border-radius: 50%;
        background: rgba(52, 211, 153, 0.12);
        color: var(--success);
        font-size: 2rem;
        font-weight: 800;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--success);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .message {
        max-width: 510px;
        margin: 24px auto 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        margin-top: 36px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-weight: 800;
        text-decoration: none;
        transition:
          transform 150ms ease,
          background 150ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        background: var(--primary);
        color: #07101f;
      }

      .button-secondary {
        border-color: var(--surface-border);
        color: var(--text);
      }

      .contact {
        margin: 32px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .contact a {
        color: var(--primary);
      }
    </style>
  </head>

  <body>
    <main class="card">
      <a class="brand" href="/" aria-label="CanineCore home">
        <span class="brand-mark" aria-hidden="true">
          <img src="/assets/caninecore-logo.png" alt="" />
        </span>
        <span>CanineCore</span>
      </a>

      <div class="confirmation-icon" aria-hidden="true">✓</div>

      <p class="eyebrow">Early access confirmed</p>
      <h1>You’re on the list.</h1>

      <p class="message">
        Thanks for joining CanineCore early access. We’ll keep you updated as
        the platform gets closer to welcoming its first pet-care businesses.
      </p>

      <div class="actions">
        <a class="button button-primary" href="/">Back to CanineCore</a>
        <a class="button button-secondary" href="mailto:founder@caninecore.app">
          Contact the founder
        </a>
      </div>

      <p class="contact">
        Questions? Email
        <a href="mailto:founder@caninecore.app"> founder@caninecore.app </a>
      </p>
    </main>

    <script>
      const submissionParameters = new URLSearchParams(window.location.search);
      const isConfirmedSubmission =
        submissionParameters.get("submitted") === "1";
      const conversionKey = "caninecore-waitlist-conversion-recorded";

      if (isConfirmedSubmission && !sessionStorage.getItem(conversionKey)) {
        gtag("event", "generate_lead", {
          method: "early_access_waitlist",
        });

        sessionStorage.setItem(conversionKey, "true");
      }
    </script>
  </body>
</html>
