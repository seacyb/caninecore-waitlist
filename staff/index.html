<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal — CanineCore</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-50 min-h-screen flex flex-col justify-between">
    <!-- TODO: The CanineCore staff workspace will be served from https://staff.caninecore.app once configured and deployed -->
    
    <header class="border-b border-slate-800 px-6 md:px-12 py-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-2.5">
                <span class="text-2xl" aria-hidden="true">🐾</span>
                <span class="text-lg font-semibold text-slate-100">CanineCore</span>
            </a>
            <a href="/" class="text-sm font-medium px-4 py-2 text-slate-300 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-sky-400">
                ← Return to CanineCore
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 md:px-12">
        <div class="w-full max-w-md">
            <div class="p-8 bg-slate-900/50 border border-slate-800 rounded-lg text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-slate-800 rounded-lg mb-6 border border-slate-700">
                    <span class="text-xl" aria-hidden="true">🔒</span>
                </div>
                <h1 class="text-2xl font-bold text-slate-50 mb-3">Staff portal coming soon</h1>
                <p class="text-slate-400 text-sm leading-relaxed">
                    The CanineCore staff workspace is not publicly available yet. Current testing is limited to authorized internal users.
                </p>
                <a href="/" class="mt-8 inline-block px-6 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold rounded-lg transition focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Return to CanineCore
                </a>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 px-6 md:px-12 py-8">
        <div class="max-w-5xl mx-auto text-center text-xs text-slate-500">
            CanineCore by <a href="https://seasidecyber.com" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-sky-400 underline transition">Seaside Cyber</a>
        </div>
    </footer>
</body>
</html>
