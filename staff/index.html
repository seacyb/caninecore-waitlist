<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal — CanineCore</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-6 md:p-12">
    <header class="flex justify-between items-center max-w-5xl w-full mx-auto">
        <a href="/" class="flex items-center space-x-2">
            <span class="text-2xl" aria-hidden="true">🐾</span>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">CanineCore</span>
        </a>
        <a href="/" class="text-xs font-semibold px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 transition">
            ← Back to Home
        </a>
    </header>

    <main class="max-w-md w-full mx-auto text-center my-auto py-12">
        <div class="p-8 bg-slate-900/60 border border-slate-800 rounded-2xl shadow-xl backdrop-blur-sm">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-500/10 text-sky-400 rounded-xl mb-4 border border-sky-500/20">
                🔐
            </div>
            <h1 class="text-2xl font-bold mb-2">Staff & Business Portal</h1>
            <p class="text-sm text-slate-400 mb-6">CanineCore staff management dashboard is currently in private beta.</p>

            <form onsubmit="event.preventDefault(); alert('Private beta access only. Please request access from the main page.');" class="space-y-4">
                <input type="email" placeholder="Staff Email" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                <input type="password" placeholder="Password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                <button type="submit" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold rounded-lg transition duration-200 text-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800/80 text-xs text-slate-500">
                Looking for early access? <a href="/" class="text-sky-400 hover:underline">Join the waitlist</a>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-600 max-w-5xl w-full mx-auto">
        CanineCore by <a href="https://seasidecyber.com" target="_blank" rel="noopener noreferrer" class="text-slate-500 hover:text-sky-400 underline">Seaside Cyber</a>
    </footer>
</body>
</html>
